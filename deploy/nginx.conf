server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The uploader accepts videos up to config.MAX_UPLOAD_BYTES (512 MB). nginx defaults to
    # 1 MB and would reject every real upload with a 413 before Flask ever saw it.
    client_max_body_size 512M;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A generate request holds the connection for the whole pipeline run. The 60s
        # default would return 504 mid-render while the work carried on server-side.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Finished thumbnails are plain files; let nginx serve them instead of gunicorn.
    location /static/ {
        alias /home/admin/thumbsmith/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
