# Thumbsmith serves port 80 as the instance default, having taken over from newszn, which
# was retired. 8090 is kept as a second listener so any bookmark or firewall rule pointing
# at the old port still works.
#
# The box still hosts support-bot (Docker, ports 8080 and 6333). Nothing here may touch it:
# this file declares its own listeners and no others, and setup.sh only ever adds its own
# config. An earlier version cleared conf.d to claim default_server and took a live site
# down — do not reintroduce that.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8090;
    listen [::]:8090;
    server_name _;

    # The uploader accepts videos up to config.MAX_UPLOAD_BYTES (512 MB). nginx defaults to
    # 1 MB and would reject every real upload with a 413 before Flask ever saw it.
    client_max_body_size 512M;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A generate request holds the connection for the whole pipeline run. The 60s
        # default would return 504 mid-render while the work carried on server-side.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Finished thumbnails are plain files; let nginx serve them instead of gunicorn.
    location /static/ {
        alias /home/admin/thumbsmith/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
